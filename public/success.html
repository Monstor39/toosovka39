<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DUBAI PARTY — оплата</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();
    for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

    ym(110941103, "init", {
      clickmap: true,
      trackLinks: true,
      accurateTrackBounce: true,
      webvisor: true
    });
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/110941103" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <!-- /Yandex.Metrika counter -->

  <style>
    .result-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .result-card {
      width: min(440px, 100%);
      background: #12121a;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px;
    }
    .spinner {
      width: 44px; height: 44px; margin: 10px auto 18px;
      border: 3px solid rgba(230, 192, 115, 0.2);
      border-top-color: var(--gold-2);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="result-wrap">
    <div class="result-card" id="card">
      <div class="spinner"></div>
      <h3 class="success__title">Проверяем оплату…</h3>
      <p class="success__sub">Обычно это занимает пару секунд.</p>
    </div>
  </div>

  <script>
    const card = document.getElementById("card");
    const orderId = new URLSearchParams(location.search).get("order");

    function showPaid(order) {
      document.title = "DUBAI PARTY — билет куплен";
      // Цель для Яндекс.Метрики: успешная покупка
      if (typeof ym === "function")
        ym(110941103, "reachGoal", "purchase", { order_price: order.total, currency: "RUB" });

      // У входного билета депозита на баре нет — пишем честно, чтобы не ждали зря
      const info = order.hasDeposit
        ? `Это ваш билет на <b>DUBAI PARTY</b>. На баре у вас <b>${order.depositLabel}</b> депозита на каждый билет — потратите их там же. По указанному контакту мы сможем связаться, чтобы не потеряться.`
        : `Это ваш <b>входной билет</b> на <b>DUBAI PARTY</b>. Депозита на баре нет — бар оплачивается отдельно. По указанному контакту мы сможем связаться, чтобы не потеряться.`;

      card.innerHTML = `
        <div class="success__check">✓</div>
        <h3 class="success__title">Оплата прошла!</h3>
        <p class="success__sub">${order.ticketName} × ${order.qty} · ${order.totalLabel}${order.wheel ? ` · колесо −${order.wheel}%` : ""}</p>
        <div class="warn-box warn-box--big">
          <span class="warn-box__title">⚠️ ВНИМАНИЕ</span>
          Обязательно сохраните код ниже — сделайте <b>СКРИНШОТ ЭКРАНА</b>.
          Вход <b>строго по билетам</b>: без кода на вход не пустят, его нужно показать охране.
        </div>
        <div class="codes">${order.codes.map((c) => `<div class="code">${c}</div>`).join("")}</div>
        <div class="success__info">
          <p>${info}</p>
        </div>
        <div style="display:grid; gap:10px">
          <a class="btn btn--line btn--full" href="/menu" style="text-decoration:none">Посмотреть карту бара</a>
          <a class="btn btn--buy btn--full" href="/" style="text-decoration:none">На главную</a>
        </div>`;
    }

    function showFail(title, text) {
      card.innerHTML = `
        <h3 class="success__title">${title}</h3>
        <p class="success__sub">${text}</p>
        <div style="display:grid; gap:10px">
          <a class="btn btn--buy btn--full" href="/" style="text-decoration:none">Вернуться на сайт</a>
          <a class="btn btn--line btn--full" href="https://t.me/TOOSOVKA39" target="_blank" rel="noopener" style="text-decoration:none">Написать в Telegram</a>
        </div>`;
    }

    let attempts = 0;
    async function poll() {
      if (!orderId) return showFail("Заказ не найден", "Ссылка неполная. Если деньги списались — напишите нам, мы всё решим.");
      try {
        const res = await fetch("/api/order-status?id=" + encodeURIComponent(orderId));
        const data = await res.json();
        if (data.status === "paid") return showPaid(data.order);
        if (data.status === "canceled")
          return showFail("Оплата не прошла", "Платёж отменён — деньги не списаны. Попробуйте купить билет ещё раз.");
        if (data.status === "not_found")
          return showFail("Заказ не найден", "Если деньги списались — напишите нам, мы всё решим.");
      } catch (e) { /* сеть моргнула — попробуем ещё раз */ }
      // pending: ждём вебхук от ЮKassa (обычно секунды), проверяем до 2 минут
      if (++attempts < 40) setTimeout(poll, 3000);
      else showFail("Оплата ещё обрабатывается", "Если деньги списались — напишите нам в Telegram, и мы отправим код вручную.");
    }
    poll();
  </script>
</body>
</html>
