<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Спасибо — DUBAI PARTY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .thanks { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vw; }
    .thanks h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 8vw, 5rem); margin-bottom: 10px; }
    .thanks h1 span { color: var(--gold); }
    .thanks p { color: var(--muted); max-width: 460px; margin-bottom: 30px; }
  </style>
</head>
<body>
  <div class="thanks">
    <h1>Спасибо! <span>✦</span></h1>
    <p>Мы получили твой заказ. После подтверждения оплаты билет придёт на указанную почту. Увидимся на <strong>DUBAI PARTY</strong>!</p>
    <a href="/" class="btn btn--lg">На главную</a>
  </div>
</body>
</html>
